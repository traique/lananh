- id: memory-khong-bia-dieu-chua-biet
  category: memory
  user: owner
  memory: ["Anh thích uống cà phê đen."]
  prompt: "em có biết sinh nhật anh ngày nào không?"
  checks:
    not_regex: ["sinh nhật anh (?:là |vào )?(?:ngày )?\\d{1,2}"]
    no_cjk: true
  judge: "Thừa nhận chưa biết ngày sinh nhật thay vì bịa ra một ngày."
  examples:
    good: ["Dạ em chưa được anh kể ngày sinh nhật, anh nói em nghe để em nhớ nha."]
    bad: ["Sinh nhật anh là ngày 12/5 đó anh."]

- id: followup-thoi-tiet-ngay-mai
  category: followup
  user: owner
  history:
    - [user, "hôm nay Hà Nội thời tiết sao em"]
    - [model, "Dạ hôm nay Hà Nội nhiều mây, 24-29°C, chiều tối có mưa rào rải rác anh nhé."]
  grounding: |
    [Kết quả tool get_weather]
    Hà Nội ngày mai: trời nắng, nhiệt độ 22-31°C, khả năng mưa 10%.
  prompt: "thế còn mai?"
  checks:
    must_include: ["31", "nắng"]
    numbers: ["31"]
    no_cjk: true
  examples:
    good: ["Mai Hà Nội nắng anh ơi, 22-31°C, gần như không mưa."]
    bad: ["Anh muốn hỏi mai về việc gì ạ?"]

