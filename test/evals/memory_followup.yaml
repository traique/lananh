# Nhớ điều đã gieo trong trí nhớ dài hạn + hiểu câu hỏi nối tiếp theo lịch sử phiên.

- id: memory-nho-ten-va-so-thich
  category: memory
  user: owner
  memory:
    - "Anh tên Tuấn, làm kỹ sư phần mềm ở Đà Nẵng."
    - "Anh dị ứng hải sản."
  prompt: "tối nay anh nên ăn gì nhỉ, gợi ý 2 món"
  checks:
    address: anh
    not_regex: ["(?<!\\w)(tôm|cua|ghẹ|mực|hàu|sò)(?!\\w)(?![^.]*(?:không|tránh|kiêng))"]
    no_cjk: true
  judge: "Gợi ý món ăn KHÔNG có hải sản (anh dị ứng hải sản)."
  examples:
    good: ["Anh thử bún bò hoặc cơm gà nha, em tránh hải sản vì anh dị ứng đó."]
    bad: ["Anh ăn lẩu tôm với cua rang me đi, ngon lắm."]

- id: memory-nho-thanh-pho
  category: memory
  user: owner
  memory: ["Anh đang sống ở Đà Nẵng."]
  prompt: "anh đang ở thành phố nào em còn nhớ không?"
  checks:
    must_include: ["Đà Nẵng"]
    no_cjk: true
  examples:
    good: ["Dạ em nhớ chứ, anh đang ở Đà Nẵng mà."]
    bad: ["Em không biết anh ở đâu ạ."]

- id: memory-thanh-vien-nho-con-gai
  category: memory
  user: member
  channel: zalo
  address_form: chị
  memory: ["Chị có con gái tên Bông, học lớp 3."]
  prompt: "con chị học lớp mấy ấy nhỉ, chị quên mất định hỏi em"
  checks:
    must_include: ["lớp 3"]
    address: chị
    no_cjk: true
