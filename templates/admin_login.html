<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Đăng nhập Admin</title>
<script>
  (function () {
    try {
      var saved = localStorage.getItem('lcta.theme') || localStorage.getItem('admin.theme');
      if (saved === 'dark' || saved === 'light') document.documentElement.dataset.theme = saved;
    } catch (e) {}
  })();
</script>
<style>
  :root{
    color-scheme:light;
    --bg:#f5f0e6; --surface:#fffcf6; --surface-2:#ece5d6;
    --border:rgba(19,32,26,.12); --border-strong:rgba(19,32,26,.40);
    --text:#13201a; --text-2:#34453b; --muted:#5b6a61;
    --accent:#0b6644; --accent-hover:#084f34; --accent-soft:rgba(11,102,68,.10); --on-accent:#f7f2e7;
    --bad-fg:#ad3420; --bad-bg:rgba(173,52,32,.10);
    --shadow:0 1px 2px rgba(19,32,26,.05),0 18px 40px -20px rgba(19,32,26,.28);
    --radius:16px; --radius-sm:9px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#07110d; --surface:#0e1b15; --surface-2:#15281f;
      --border:rgba(214,236,222,.10); --border-strong:rgba(214,236,222,.32);
      --text:#eef4ec; --text-2:#c6d5ca; --muted:#94a89b;
      --accent:#3fcf8e; --accent-hover:#6adca8; --accent-soft:rgba(63,207,142,.14); --on-accent:#062014;
      --bad-fg:#ff9b85; --bad-bg:rgba(255,155,133,.16);
      --shadow:0 1px 2px rgba(0,0,0,.45),0 18px 40px -20px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#07110d; --surface:#0e1b15; --surface-2:#15281f;
    --border:rgba(214,236,222,.10); --border-strong:rgba(214,236,222,.32);
    --text:#eef4ec; --text-2:#c6d5ca; --muted:#94a89b;
    --accent:#3fcf8e; --accent-hover:#6adca8; --accent-soft:rgba(63,207,142,.14); --on-accent:#062014;
    --bad-fg:#ff9b85; --bad-bg:rgba(255,155,133,.16);
    --shadow:0 1px 2px rgba(0,0,0,.45),0 18px 40px -20px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:radial-gradient(1100px 520px at 85% -10%,var(--accent-soft),transparent 60%),var(--bg);background-attachment:fixed;color:var(--text);
    font-family:Manrope,"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.5;
    display:flex;align-items:center;justify-content:center;padding:24px 16px;
  }
  button,input{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .card{
    width:100%;max-width:380px;padding:30px 28px 26px;background:var(--surface);
    border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
  }
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .logo{display:block;flex:none}
  .logo img{height:40px;width:auto;display:block}
  h1{font-size:18px;margin:0;letter-spacing:-.015em}
  p.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);margin:14px 0 6px}
  input{
    width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);
    font-size:15px;background:var(--surface);min-height:42px;
  }
  input::placeholder{color:var(--muted)}
  button{
    width:100%;margin-top:22px;padding:11px;border:1px solid var(--accent);border-radius:var(--radius-sm);
    font-size:14.5px;font-weight:600;color:var(--on-accent);cursor:pointer;background:linear-gradient(150deg,var(--accent),var(--accent-hover));min-height:44px;border-radius:999px;
    transition:background .12s;
  }
  button:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
  .err{
    display:flex;align-items:flex-start;gap:8px;background:var(--bad-bg);color:var(--bad-fg);
    font-size:13px;font-weight:600;padding:10px 12px;border-radius:var(--radius-sm);margin-top:16px;
  }
  .foot{margin-top:18px;text-align:center;color:var(--muted);font-size:12px}
  .foot a{color:var(--muted)}
  @media (max-width:400px){.card{padding:24px 18px 20px}}
  .logo img.logo-d{display:none}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo img.logo-l{display:none}:root:not([data-theme="light"]) .logo img.logo-d{display:block}}:root[data-theme="dark"] .logo img.logo-l{display:none}:root[data-theme="dark"] .logo img.logo-d{display:block}
</style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <span class="logo"><img class="logo-l" src="/static/logo-light.webp" alt="LCTA" height="40"><img class="logo-d" src="/static/logo-dark.webp" alt="LCTA" height="40"></span>
      <div>
        <h1>Lan Anh Bot</h1>
        <p class="sub">Đăng nhập để quản lý bot, dùng AI luận giải và sửa địa điểm thời tiết.</p>
      </div>
    </div>
    <form method="post" action="/admin/login">
      <input type="hidden" name="next" value="<!--NEXT-->">
      <label for="username">Tài khoản</label>
      <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      <label for="password">Mật khẩu</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Đăng nhập</button>
    </form>
    <!--ERROR-->
    <div class="foot">Phiên đăng nhập hết hạn sau một thời gian; đăng xuất sẽ thu hồi mọi phiên đang mở.</div>
  </main>
</body>
</html>
