<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Đăng nhập Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap">
<script>
  (function () {
    try {
      var saved = localStorage.getItem('lcta.theme') || localStorage.getItem('admin.theme');
      if (saved === 'dark' || saved === 'light') document.documentElement.dataset.theme = saved;
    } catch (e) {}
  })();
</script>
<style>
  :root{
    color-scheme:light;
    --bg:#ffffff; --surface:#eff3ec; --surface-2:#e5ebe1;
    --border:#e3e8df; --border-strong:#7d887f;
    --text:#121a15; --text-2:#2c362f; --muted:#4f5b53;
    --accent:#1f6b45; --accent-hover:#16241c; --accent-soft:#e3e9df; --on-accent:#ffffff;
    --primary:#16241c; --on-primary:#ffffff;
    --bad-fg:#7f1d17; --bad-bg:#fbe7e4;
    --radius:16px; --radius-sm:10px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#0e100f; --surface:#171a18; --surface-2:#1f2320;
      --border:#242926; --border-strong:#6f7871;
      --text:#eef1ee; --text-2:#d5dbd6; --muted:#b2bab4;
      --accent:#63c08f; --accent-hover:#eef1ee; --accent-soft:#232825; --on-accent:#0b1f13;
      --primary:#eef1ee; --on-primary:#0e100f;
      --bad-fg:#f1998f; --bad-bg:#321c1a;
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0e100f; --surface:#171a18; --surface-2:#1f2320;
    --border:#242926; --border-strong:#6f7871;
    --text:#eef1ee; --text-2:#d5dbd6; --muted:#b2bab4;
    --accent:#63c08f; --accent-hover:#eef1ee; --accent-soft:#232825; --on-accent:#0b1f13;
    --primary:#eef1ee; --on-primary:#0e100f;
    --bad-fg:#f1998f; --bad-bg:#321c1a;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--text);
    font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.5;
    display:flex;align-items:center;justify-content:center;padding:24px 16px;
  }
  button,input{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .card{
    width:100%;max-width:380px;padding:30px 28px 26px;background:var(--surface);
    border:0;border-radius:var(--radius);
  }
  .brand{display:flex;flex-direction:column;align-items:flex-start;gap:14px;margin-bottom:8px}
  .logo{display:block;flex:none}
  .logo img{height:32px;width:auto;display:block}
  h1{font-size:18px;font-weight:600;margin:0}
  p.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
  label{display:block;font-size:14px;font-weight:500;color:var(--text);margin:16px 0 8px}
  input{
    width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);
    font-size:15px;background:var(--bg);min-height:42px;
  }
  input::placeholder{color:var(--muted)}
  button{
    width:100%;margin-top:22px;padding:11px;border:1px solid var(--primary);border-radius:var(--radius-sm);
    font-size:15px;font-weight:500;color:var(--on-primary);cursor:pointer;background:var(--primary);min-height:44px;border-radius:999px;
    transition:background .12s;
  }
  button:hover{opacity:.9}
  .err{
    display:flex;align-items:flex-start;gap:8px;background:var(--bad-bg);color:var(--bad-fg);
    font-size:14px;font-weight:500;padding:10px 12px;border-radius:var(--radius-sm);margin-top:16px;
  }
  .foot{margin-top:18px;text-align:center;color:var(--muted);font-size:12px}
  .foot a{color:var(--muted)}
  @media (max-width:400px){.card{padding:24px 18px 20px}}
  .logo img.logo-d{display:none}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo img.logo-l{display:none}:root:not([data-theme="light"]) .logo img.logo-d{display:block}}:root[data-theme="dark"] .logo img.logo-l{display:none}:root[data-theme="dark"] .logo img.logo-d{display:block}
</style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <span class="logo"><img class="logo-l" src="/static/logo-light.webp" alt="LCTA" height="40"><img class="logo-d" src="/static/logo-dark.webp" alt="LCTA" height="40"></span>
      <div>
        <h1>Lan Anh Bot</h1>
        <p class="sub">Đăng nhập để quản lý bot, dùng AI luận giải và sửa địa điểm thời tiết.</p>
      </div>
    </div>
    <form method="post" action="/admin/login">
      <input type="hidden" name="next" value="<!--NEXT-->">
      <label for="username">Tài khoản</label>
      <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      <label for="password">Mật khẩu</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Đăng nhập</button>
    </form>
    <!--ERROR-->
    <div class="foot">Phiên đăng nhập hết hạn sau một thời gian; đăng xuất sẽ thu hồi mọi phiên đang mở.</div>
  </main>
</body>
</html>
