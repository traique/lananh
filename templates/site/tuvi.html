{% extends "base.html" %}
{% block content %}
<div class="narrow">
  <h1>Lá số tử vi</h1>
  <p class="lead">An lá số Tử Vi Đẩu Số theo cách phổ biến ở Việt Nam. Thông tin chỉ dùng để tính, không lưu lại.</p>
  {% include "_errors.html" %}
  <form class="panel form" action="/tu-vi" method="post" novalidate>
    <fieldset>
      <legend>Ngày sinh <span aria-hidden="true">*</span></legend>
      <div class="date-parts">
        <div class="field"><label for="ngay">Ngày</label><input type="number" id="ngay" name="ngay" value="{{ form.ngay }}" min="1" max="31" inputmode="numeric" required aria-required="true"{% if error %} aria-describedby="form-error"{% endif %}></div>
        <div class="field"><label for="thang">Tháng</label><input type="number" id="thang" name="thang" value="{{ form.thang }}" min="1" max="12" inputmode="numeric" required aria-required="true"></div>
        <div class="field"><label for="nam">Năm</label><input type="number" id="nam" name="nam" value="{{ form.nam }}" min="1900" max="2100" inputmode="numeric" required aria-required="true"></div>
      </div>
    </fieldset>
    <fieldset>
      <legend>Lịch của ngày sinh</legend>
      <div class="choices">
        <label><input type="radio" name="lich" value="duong"{% if form.lich != "am" %} checked{% endif %}> Dương lịch</label>
        <label><input type="radio" name="lich" value="am"{% if form.lich == "am" %} checked{% endif %}> Âm lịch</label>
        <label><input type="checkbox" name="nhuan" value="1"{% if form.nhuan %} checked{% endif %}> Tháng nhuận</label>
      </div>
    </fieldset>
    <div class="form-row">
      <div class="field">
        <label for="gio">Giờ sinh <span aria-hidden="true">*</span></label>
        <select id="gio" name="gio" required aria-required="true">
          {% for idx, name, span in hours %}
          <option value="{{ idx }}"{% if form.gio == idx|string %} selected{% endif %}>Giờ {{ name }} ({{ span }})</option>
          {% endfor %}
        </select>
      </div>
      <fieldset>
        <legend>Giới tính <span aria-hidden="true">*</span></legend>
        <div class="choices">
          <label><input type="radio" name="gioi" value="male"{% if form.gioi != "female" %} checked{% endif %}> Nam</label>
          <label><input type="radio" name="gioi" value="female"{% if form.gioi == "female" %} checked{% endif %}> Nữ</label>
        </div>
      </fieldset>
    </div>
    <div><button class="btn" type="submit">An lá số</button></div>
  </form>
</div>
{% endblock %}
