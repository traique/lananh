<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ title }} · LCTA{% endblock %}</title>
  <meta name="description" content="{{ description }}">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/static/favicon.png?v={{ v }}" type="image/png">
  <style>{{ inline_css }}</style>
</head>
<body>
  <a class="skip-link" href="#main">Bỏ qua đến nội dung chính</a>
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="/" aria-label="LCTA - Trang chủ">
        <picture>
          <source srcset="/static/logo-dark.webp?v={{ v }}" media="(prefers-color-scheme: dark)">
          <img src="/static/logo-light.webp?v={{ v }}" alt="LCTA" width="69" height="48">
        </picture>
      </a>
      <nav class="site-nav" aria-label="Điều hướng chính">
        <ul>
          {% for href, label in nav %}
          <li><a href="{{ href }}"{% if href == active %} aria-current="page"{% endif %}>{{ label }}</a></li>
          {% endfor %}
        </ul>
      </nav>
      <div class="site-actions">
        <a class="btn btn-secondary btn-sm" href="/admin">Quản trị</a>
        <form method="post" action="/admin/logout">
          <button class="btn-link" type="submit">Đăng xuất</button>
        </form>
      </div>
    </div>
  </header>
  <main id="main" tabindex="-1">
    {% if tabs %}
    <nav class="tabs" aria-label="Mục lịch">
      {% for href, label in tabs %}
      <a href="{{ href }}"{% if href == tab %} aria-current="page"{% endif %}>{{ label }}</a>
      {% endfor %}
    </nav>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="inner">
      <span>© LCTA · tính bằng thuật toán, không dùng AI</span>
      <a href="/privacy">Quyền riêng tư</a>
      <a href="/terms">Điều khoản</a>
    </div>
  </footer>
</body>
</html>
