{% extends "base.html" %}
{% block content %}
<div class="narrow">
  <h1>Thần số học</h1>
  <p class="lead">Tính theo hệ Pythagoras phổ biến ở Việt Nam. Thông tin chỉ dùng để tính, không lưu lại.</p>
  {% include "_errors.html" %}
  <form class="panel form" action="/than-so-hoc" method="post" novalidate>
    <div class="field">
      <label for="ngay">Ngày sinh (dương lịch) <span aria-hidden="true">*</span></label>
      <input type="date" id="ngay" name="ngay" value="{{ form.ngay }}" min="1900-01-01" max="2100-12-31" required aria-required="true"{% if error %} aria-describedby="form-error"{% endif %}>
    </div>
    <div class="field">
      <label for="ten">Họ tên (không bắt buộc)</label>
      <input type="text" id="ten" name="ten" value="{{ form.ten }}" maxlength="80" autocomplete="name" aria-describedby="ten-hint">
      <span class="hint" id="ten-hint">Có họ tên thì tính thêm số linh hồn, nhân cách, sứ mệnh.</span>
    </div>
    <div><button class="btn" type="submit">Tính</button></div>
  </form>
</div>
{% endblock %}
