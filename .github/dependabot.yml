# Dependabot: PR cập nhật dependency theo tuần, gom nhóm để không ngập PR.
# Bản vá bảo mật luôn được mở PR riêng ngay khi có (không chịu cooldown).
#
# cooldown 7 ngày: chỉ đề xuất bản phát hành đã "sống" ít nhất 1 tuần - bản độc
# kiểu LiteLLM 1.82.7/1.82.8 (3/2026) thường bị gỡ trong vài giờ tới vài ngày.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      python-minor:
        update-types: [minor, patch]
    ignore:
      # google-genai 2.11 yêu cầu tenacity<9.2: nâng tenacity khi nâng google-genai.
      - dependency-name: tenacity
        versions: [">=9.2"]
  - package-ecosystem: npm
    directory: /zalo-gateway
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      npm-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
  # Base image Dockerfile (python:3.12-slim-trixie, node:22-bookworm-slim). Giữ
  # nguyên Python 3.12 / Node 22: chỉ nhận cập nhật cùng dòng (và digest nếu sau
  # này ghim @sha256).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
