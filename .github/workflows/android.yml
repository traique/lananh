# Build APK app Android màn hình thông tin (android/, xem android/README.md).
#
# KHÔNG chạy khi push lên main/master: Render deploy với autoDeployTrigger: checksPass
# (chờ MỌI check của commit xanh) - build Android lỗi không được chặn deploy bot.
# Chạy ở PR/nhánh khác khi android/ đổi, hoặc bấm tay (Actions > Android APK > Run
# workflow) để lấy APK từ main. APK nằm ở mục Artifacts của lượt chạy.
#
# Ký APK: có đủ 4 secret ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD thì ký bằng keystore đó (cài bản mới đè
# lên bản cũ được); thiếu thì ký debug key tạm (phải gỡ app cũ trước khi cài bản mới).
name: Android APK

on:
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  push:
    branches-ignore: [main, master]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Giải mã keystore (nếu có secret)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Chưa có secret ANDROID_KEYSTORE_BASE64 - APK ký bằng debug key tạm."
          fi
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon --stacktrace assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: lananh-manhinh-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
