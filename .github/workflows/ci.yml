# CI: chạy đúng các lệnh kiểm tra trong AGENTS.md.
# - python-format: ruff check toàn repo + ruff format --check CHỈ trên file .py
#   thay đổi (repo cũ chưa format toàn bộ; pyproject bật force-exclude để
#   [tool.ruff.format].exclude vẫn áp dụng cho đường dẫn tường minh).
# - python-test: pytest -q (gồm test/test_migration_lock.py: sửa migration đã áp
#   bị bắt ngay ở PR).
# - sql-pglite: test SQL state-transition trên PGlite (Node 22).
# - zalo-gateway: tsc + prettier + node --test.
# - docker-build: build image rồi CHẠY thử trong image (import, pip check, node,
#   zca-js) - lỗi đóng gói không lọt lên Render.
#
# Render deploy với autoDeployTrigger: checksPass (render.yaml) = chờ MỌI check
# của commit xanh. Vì vậy quét CVE (pip-audit/npm audit, đỏ bất cứ lúc nào có
# advisory mới, không phụ thuộc commit) nằm riêng ở audit.yml (PR + lịch tuần),
# không chặn deploy hotfix.
#
# Cài Python: PyPI cho mọi package; kho riêng vnstocks.com chỉ cho 3 package ghim
# trong requirements-vnstock.txt (--no-deps), rồi pip check.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

# Chỉ huỷ run cũ của PR. Trên main KHÔNG huỷ: checksPass cần check của commit
# xanh, nếu run bị huỷ (vd commit bot "[skip render]" từ /ragxuly đẩy ngay sau)
# thì commit của chủ bot không bao giờ deploy, còn commit bot thì Render bỏ qua.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-vnstock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -r requirements-vnstock.txt
          pip check

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format (changed .py files only)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
          fi
          # Push nhánh mới (before = 000...0), force-push mất commit cũ, hoặc
          # thiếu SHA: so với commit liền trước.
          if [ -z "$base" ] || [ -z "${base//0/}" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            if git rev-parse --verify --quiet HEAD~1 >/dev/null; then
              base="HEAD~1"
            else
              echo "Không có commit trước để so sánh; bỏ qua format check."
              exit 0
            fi
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.py')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Không có file .py thay đổi so với $base."
            exit 0
          fi
          printf 'Kiểm tra format:\n'
          printf '  %s\n' "${files[@]}"
          ruff format --check -- "${files[@]}"

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-vnstock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -r requirements-vnstock.txt
          pip check

      - name: Pytest
        run: pytest -q

  python-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-vnstock.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -r requirements-vnstock.txt
          pip check

      # pyrightconfig.json: mức basic, phần lớn rule ở mức warning - job này chỉ
      # fail khi có error (reportUnusedCoroutine, lỗi cú pháp kiểu...).
      - name: Pyright
        run: pyright

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      # Build image (multi-stage Node 22 + Python 3.12), không push; load vào
      # docker local để chạy thử bước dưới.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: lananh:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Chạy thử TRONG image (không phải venv CI): .dockerignore loại test/, binary
      # node chép từ stage bookworm sang python slim, node_modules đã prune - lỗi ở
      # các bước đó chỉ lộ ra khi chạy image. Không gọi mạng, không cần secret.
      - name: Smoke test image
        run: |
          docker run --rm -e TELEGRAM_TOKEN=ci-dummy -e ALLOWED_USER_ID=1 lananh:ci sh -euc '
            python -c "import web, bot_app, scheduler, main"
            pip check
            node --version
            node --check zalo-gateway/dist/index.js
            cd zalo-gateway
            node --input-type=module -e "await import(\"zca-js\")"
          '

  sql-pglite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-vnstock.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: test/sql_support/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -r requirements-vnstock.txt
          pip check

      - name: Install PGlite
        working-directory: test/sql_support
        run: npm ci

      - name: SQL tests on PGlite
        env:
          TEST_PGLITE: "1"
        run: pytest -q test/test_delivery_sql.py test/test_migrations.py test/test_zalo_outbox_sql.py test/test_ops_sql.py test/test_observability_sql.py

  zalo-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zalo-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: zalo-gateway/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test
