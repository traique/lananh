# One Docker service runs Python/Telegram and the local Zalo gateway.
services:
  - type: web
    name: lananh
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    numInstances: 1
    healthCheckPath: /
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: ALLOWED_USER_ID
        sync: false
      - key: ROUTER9_API_KEY
        sync: false
      - key: ROUTER9_BASE_URL
        value: https://ninerouter-v2.onrender.com/auth/chatgpt/v1
      - key: ROUTER9_MODEL
        value: gpt-4o-mini
      - key: DATABASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: SETTINGS_ENC_KEY
        sync: false
      - key: DIAGNOSE_SECRET
        generateValue: true
      - key: GOOGLE_AI_STUDIO_API_KEY_1
        sync: false
      - key: GOOGLE_AI_STUDIO_API_KEY_2
        sync: false
      - key: GOOGLE_AI_STUDIO_MODEL
        value: gemini-2.5-flash
      - key: ZALO_ENABLED
        value: "false"
      - key: ZALO_COOKIE_JSON
        sync: false
      - key: ZALO_IMEI
        sync: false
      - key: ZALO_USER_AGENT
        sync: false
      - key: ZALO_CONTROLLER_ID
        sync: false
      - key: ZALO_BOT_ACCOUNT_ID
        value: zalo-bot
      - key: ZALO_BRIDGE_SECRET
        generateValue: true
      - key: ZALO_CONTROL_PORT
        value: "9901"
      - key: ZALO_GROUP_REFRESH_MS
        value: "60000"
      - key: ZALO_OUTBOX_POLL_MS
        value: "15000"
      - key: ZALO_GROUP_RETENTION_DAYS
        value: "30"
      - key: ZALO_DAILY_SUMMARY_HOUR
        value: "9"
      - key: TELEGRAM_CONNECT_TIMEOUT
        value: "30"
      - key: TELEGRAM_READ_TIMEOUT
        value: "90"
      - key: TELEGRAM_WRITE_TIMEOUT
        value: "90"
      - key: TELEGRAM_POOL_TIMEOUT
        value: "30"
      - key: TELEGRAM_MEDIA_RETRIES
        value: "3"
      - key: CHAT_HISTORY_TURNS
        value: "8"
      - key: CHAT_SESSION_TIMEOUT_SEC
        value: "21600"
      # Heavy research jobs must never share the free web-service process.
      - key: STOCK_BACKTEST_ALLOW_ON_RENDER
        value: "false"
      - key: ROUTER9_PROBE_INTERVAL_SEC
        value: "900"
      - key: API_QUOTA_COOLDOWN_SEC
        value: "3600"
      - key: ROUTER9_CALL_TIMEOUT_SEC
        value: "30"
      - key: ROUTER9_MAX_CONCURRENCY
        value: "4"
      - key: ZOOM_ENABLED
        value: "false"
      - key: ZOOM_CLIENT_ID
        sync: false
      - key: ZOOM_CLIENT_SECRET
        sync: false
      - key: ZOOM_BOT_JID
        sync: false
      - key: ZOOM_SECRET_TOKEN
        sync: false
      - key: ZOOM_VERIFICATION_TOKEN
        sync: false
      - key: ZOOM_ACCOUNT_ID
        sync: false
