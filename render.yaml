# One Docker service runs Python/Telegram and the local Zalo gateway.
services:
  - type: web
    name: lananh
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    numInstances: 1
    # Chỉ deploy khi MỌI check CI của commit xanh (ci.yml). Quét CVE nằm riêng ở
    # audit.yml để advisory mới không chặn deploy. Deploy tay trên dashboard vẫn
    # dùng được khi cần vượt qua; commit có [skip render] vẫn được bỏ qua.
    autoDeployTrigger: checksPass
    # Health check giữ GET / (nhẹ, không chạm DB); /healthz (có kiểm tra DB) để
    # UptimeRobot cảnh báo, không để Render restart vì Supabase chập chờn.
    healthCheckPath: /
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: ALLOWED_USER_ID
        sync: false
      - key: ROUTER9_API_KEY
        sync: false
      - key: ROUTER9_BASE_URL
        sync: false
      - key: ROUTER9_MODEL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: SETTINGS_ENC_KEY
        sync: false
      - key: DIAGNOSE_SECRET
        generateValue: true
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: GOOGLE_AI_STUDIO_API_KEY_1
        sync: false
      - key: GOOGLE_AI_STUDIO_API_KEY_2
        sync: false
      - key: GOOGLE_AI_STUDIO_MODEL
        value: gemini-3.5-flash-lite
      # Gemini Live (key api1/api2, cooldown riêng): provider chat dự phòng cuối chuỗi
      # + bộ đọc /noi (VOICE_ENGINE). Hạn mức free tier chưa được Google công bố -
      # xem aistudio.google.com/rate-limit; /status đếm số lượt Live trong ngày.
      - key: LIVE_CHAT_FALLBACK
        value: "1"
      - key: LIVE_MODEL
        value: "gemini-3.8-live"
      - key: LIVE_MAX_SESSIONS
        value: "1"
      - key: LIVE_CALL_TIMEOUT_SEC
        value: "60"
      - key: LIVE_MAX_AUDIO_MB
        value: "8"
      - key: LIVE_HISTORY_MESSAGES
        value: "6"
      - key: MAX_CONCURRENT_TURNS
        value: "2"
      # 1 chỗ trong MAX_CONCURRENT_TURNS dành riêng cho chủ bot (Telegram/Zoom/web);
      # mọi lượt Zalo dùng chỗ còn lại. 0 = tắt.
      - key: OWNER_RESERVED_SLOTS
        value: "1"
      # Gateway Zalo xử lý song song = số chỗ của thành viên (MAX - OWNER_RESERVED_SLOTS)
      # để tin chờ ở gateway, không chờ trong Python quá BRIDGE_TIMEOUT_MS.
      - key: ZALO_DIRECT_CONCURRENCY
        value: "1"
      # Giới hạn mỗi ngày của thành viên Zalo (0 = không giới hạn; sửa được trên /admin).
      - key: ZALO_MEMBER_DAILY_TURNS
        value: "40"
      - key: ZALO_MEMBER_DAILY_HEAVY
        value: "5"
      - key: ZALO_ENABLED
        value: "true"
      - key: ZALO_COOKIE_JSON
        sync: false
      - key: ZALO_IMEI
        sync: false
      - key: ZALO_USER_AGENT
        sync: false
      - key: ZALO_CONTROLLER_ID
        sync: false
      - key: ZALO_BOT_ACCOUNT_ID
        sync: false
      - key: ZALO_BRIDGE_SECRET
        generateValue: true
      - key: ZALO_CONTROL_PORT
        value: "9901"
      - key: ZALO_GROUP_REFRESH_MS
        value: "60000"
      - key: ZALO_OUTBOX_POLL_MS
        value: "15000"
      - key: ZALO_GROUP_RETENTION_DAYS
        value: "30"
      - key: ZALO_DAILY_SUMMARY_HOUR
        value: "9"
      - key: ZALO_WELCOME_ON_PAIR
        value: "1"
      # Gateway: gộp tin chữ liên tiếp (ms), nghỉ giữa các tin gửi (ms), ngân sách
      # outbox/giờ (vượt thì hoãn), typing/đã xem/reaction.
      - key: ZALO_DIRECT_DEBOUNCE_MS
        value: "2000"
      - key: ZALO_DIRECT_DEBOUNCE_MAX_MS
        value: "6000"
      - key: ZALO_DIRECT_DEBOUNCE_MAX_MESSAGES
        value: "4"
      - key: ZALO_SEND_GAP_MIN_MS
        value: "600"
      - key: ZALO_SEND_GAP_MAX_MS
        value: "1500"
      - key: ZALO_OUTBOX_MAX_PER_HOUR
        value: "60"
      - key: ZALO_PRESENCE_EVENTS
        value: "1"
      - key: TELEGRAM_CONNECT_TIMEOUT
        value: "30"
      - key: TELEGRAM_READ_TIMEOUT
        value: "90"
      - key: TELEGRAM_WRITE_TIMEOUT
        value: "90"
      - key: TELEGRAM_POOL_TIMEOUT
        value: "30"
      - key: TELEGRAM_MEDIA_RETRIES
        value: "3"
      - key: TELEGRAM_STATUS_DELAY_SEC
        value: "7"
      - key: TELEGRAM_BUSY_REACTIONS
        value: "true"
      - key: TELEGRAM_ANSWER_BUTTONS
        value: "true"
      - key: TELEGRAM_STREAM_DRAFTS
        value: "false"
      - key: TELEGRAM_RICH_MESSAGES
        value: "false"
      # Fine-grained GitHub token: chỉ cấp repo này + Contents: write.
      # /ragxuly dùng token này để commit rag/*.md với [skip render].
      - key: GITHUB_RAG_TOKEN
        sync: false
      # Số LƯỢT hỏi-đáp (mỗi lượt 2 dòng lịch sử) đưa vào prompt.
      - key: CHAT_HISTORY_TURNS
        value: "10"
      - key: CHAT_SESSION_TIMEOUT_SEC
        value: "21600"
      # Trí nhớ: trích theo lô (>= 3 lượt chưa xử lý hoặc rảnh 30 phút), gộp fact khi gần đầy.
      - key: MEMORY_FLUSH_EXCHANGES
        value: "3"
      - key: MEMORY_IDLE_FLUSH_SEC
        value: "1800"
      - key: MEMORY_CONSOLIDATION
        value: "1"
      # "Cách trả lời" bộ trích nhớ tự rút ra chờ người dùng duyệt; 0 = áp ngay.
      - key: STYLE_RULES_NEED_APPROVAL
        value: "1"
      # Che OTP/mật khẩu/STK/CCCD/số thẻ/API key trước khi gửi provider AI.
      - key: PROMPT_REDACTION
        value: "1"
      # Vòng quét nền trích nhớ khi rảnh (cả lúc khởi động); 0 = tắt vòng quét.
      - key: MEMORY_SWEEP_ENABLED
        value: "1"
      - key: MEMORY_SWEEP_SEC
        value: "600"
      - key: GROQ_HISTORY_MAX_CHARS
        value: "3500"
      # Đọc link trong chat (chủ bot/admin; thành viên khi =1) và tra tự động kho rag/.
      - key: CHAT_READ_LINKS
        value: "1"
      - key: CHAT_READ_LINKS_MEMBERS
        value: "0"
      - key: CHAT_AUTO_RAG
        value: "1"
      # Hỏi thăm chủ động theo trí nhớ (chủ bot Telegram mặc định; Zalo tự /hoithan on).
      - key: PROACTIVE_FOLLOWUPS
        value: "1"
      - key: PROACTIVE_ACTIVE_HOURS
        value: "08:00-21:30"
      - key: PROACTIVE_DAILY_CAP
        value: "2"
      - key: PROACTIVE_FOLLOWUP_HOUR
        value: "18"
      - key: PROACTIVE_IDLE_MIN
        value: "20"
      - key: PROACTIVE_TICK_SEC
        value: "1800"
      # Gom thông báo chủ động + giờ yên lặng (services/notify_hub.py, /yenlang); 0 = tắt.
      - key: NOTIFY_HUB_ENABLED
        value: "1"
      - key: NOTIFY_BATCH_MINUTES
        value: "60"
      - key: NOTIFY_QUIET_HOURS
        value: "22:30-06:30"
      - key: NOTIFY_QUEUE_MAX_PER_USER
        value: "30"
      # Việc nền /viec + tác vụ định kỳ /lichtacvu (services/background_jobs.py).
      - key: BACKGROUND_JOBS_ENABLED
        value: "1"
      - key: BACKGROUND_JOB_TIMEOUT_SEC
        value: "600"
      - key: BACKGROUND_JOBS_CONCURRENCY
        value: "1"
      - key: BACKGROUND_JOBS_MAX_PER_USER
        value: "3"
      - key: BACKGROUND_JOBS_MEMBERS
        value: "1"
      - key: ROUTINES_ENABLED
        value: "1"
      - key: ROUTINES_MEMBERS
        value: "0"
      - key: ROUTINE_MAX_RUNS_PER_DAY
        value: "20"
      # Bản tin sáng cá nhân (/bantin): chỉ gửi cho người tự bật trên kênh của mình.
      - key: MORNING_BRIEF_ENABLED
        value: "true"
      - key: MORNING_BRIEF_DEFAULT_HOUR
        value: "7"
      - key: MORNING_BRIEF_MAX_MEMBERS
        value: "20"
      - key: MORNING_BRIEF_ABSORB_NEWS
        value: "true"
      - key: MORNING_BRIEF_AI_INTRO
        value: "false"
      - key: MORNING_BRIEF_EXPENSES
        value: "true"
      # Chi tiêu: "cafe 45k" ghi bằng code (false = chỉ khi nói rõ hoặc /chitieu).
      - key: EXPENSE_CHAT_CAPTURE
        value: "true"
      # Hỏi tự nhiên thay cho lệnh (services/nl_commands.py) + lệnh trong router tool.
      - key: NL_COMMANDS_ENABLED
        value: "1"
      - key: NL_COMMANDS_LLM
        value: "1"
      # Ăn uống /an: câu tự nhiên tắt, không ước lượng kcal bằng AI (bảng soạn sẵn).
      - key: NUTRITION_NL
        value: "0"
      - key: NUTRITION_AI_ESTIMATE
        value: "0"
      # Lịch sử chat mỗi người (tool search_history "hôm trước em nói gì...").
      - key: CHAT_MESSAGES_RETENTION_LIMIT
        value: "1000"
      # Tin thoại (Groq Whisper -> Gemini), lượt chỉ đọc; ảnh kèm câu hỏi -> trả lời về
      # ảnh (không caption vẫn viết prompt); file PDF/TXT/DOCX -> tóm tắt/hỏi đáp.
      - key: VOICE_STT_ENABLED
        value: "1"
      - key: GROQ_STT_MODEL
        value: "whisper-large-v3-turbo"
      - key: VOICE_STT_LANGUAGE
        value: "vi"
      - key: VOICE_MAX_BYTES
        value: "5242880"
      - key: VOICE_MAX_SECONDS
        value: "180"
      # Trả lời kèm giọng nói /noi (mỗi người tự bật); Zalo cần ffmpeg trong image.
      - key: VOICE_REPLY_ENABLED
        value: "1"
      - key: VOICE_REPLY_MAX_CHARS
        value: "600"
      - key: VOICE_TTS_MODEL
        value: "gemini-3.8-flash-tts"
      - key: VOICE_TTS_VOICE
        value: "Sulafat"
      # auto = Gemini Live trước, lỗi/quota/đọc lệch chữ thì Gemini TTS; live | tts.
      - key: VOICE_ENGINE
        value: "auto"
      - key: LIVE_VOICE_MIN_MATCH
        value: "80"
      - key: VOICE_REPLY_URL_TTL_MIN
        value: "10"
      - key: VOICE_REPLY_STORE_MB
        value: "4"
      # Trang avatar: giọng Hoài My (Microsoft Edge TTS, dịch vụ không chính thức - lỗi thì
      # đọc lại bằng giọng Gemini). Tốc độ/cao độ/âm lượng theo định dạng edge-tts.
      - key: AVATAR_EDGE_RATE
        value: "-6%"
      - key: AVATAR_EDGE_PITCH
        value: "+12Hz"
      - key: AVATAR_EDGE_VOLUME
        value: "+0%"
      - key: VISION_QA_ENABLED
        value: "1"
      - key: PHOTO_NO_CAPTION_MODE
        value: "prompt"
      - key: DOCUMENT_QA_ENABLED
        value: "1"
      - key: DOCUMENT_MAX_BYTES
        value: "5242880"
      - key: DOCUMENT_MAX_CHARS
        value: "40000"
      # Chỉ engine miễn phí; mistral-ocr/native (tính tiền) bị coi như tắt.
      - key: OPENROUTER_PDF_ENGINE
        value: "cloudflare-ai"
      # Heavy research jobs must never share the free web-service process.
      - key: STOCK_BACKTEST_ALLOW_ON_RENDER
        value: "false"
      # Danh mục cổ phiếu: digest bỏ qua ngày không có phiên.
      - key: DIGEST_ON_NON_TRADING_DAYS
        value: "false"
      # Sổ giao dịch: phí CTCK mỗi chiều, thuế TNCN khi bán.
      - key: STOCK_FEE_RATE
        value: "0.0015"
      - key: STOCK_SELL_TAX_RATE
        value: "0.001"
      # Job danh mục hằng ngày + trần tin chủ động qua Zalo.
      - key: PORTFOLIO_EVENTS_ENABLED
        value: "1"
      - key: PORTFOLIO_EVENTS_HOUR_VN
        value: "8"
      - key: PORTFOLIO_EVENTS_MAX_HOLDINGS
        value: "60"
      - key: PORTFOLIO_EVENT_NOTICES
        value: "1"
      - key: PORTFOLIO_EVENTS_MAX_SYMBOLS
        value: "40"
      - key: PORTFOLIO_PUSH_ZALO_DAILY_CAP
        value: "5"
      # Cảnh báo giá trong phiên (chỉ giờ giao dịch, tick hôm nay).
      - key: PRICE_ALERTS_ENABLED
        value: "1"
      - key: PRICE_ALERTS_HOLDINGS_INTRADAY
        value: "1"
      - key: PRICE_ALERT_POLL_SEC
        value: "300"
      - key: PRICE_ALERT_MAX_SYMBOLS
        value: "40"
      - key: PRICE_ALERT_MAX_PER_USER
        value: "10"
      - key: WATCHLIST_MAX_SYMBOLS
        value: "20"
      - key: ROUTER9_PROBE_INTERVAL_SEC
        value: "900"
      - key: API_QUOTA_COOLDOWN_SEC
        value: "3600"
      # Provider tự tra web khi Tavily tắt/lỗi/mỏng. OpenRouter tốn credit,
      # 9Router chưa xác minh được - cả 2 tắt mặc định.
      - key: GROQ_REALTIME_MODEL
        value: "openai/gpt-oss-120b"
      - key: GROQ_WEB_SEARCH
        value: "1"
      - key: OPENROUTER_WEB_SEARCH
        value: "0"
      - key: ROUTER9_WEB_SEARCH
        value: "0"
      - key: REPLY_URL_FILTER
        value: "untrusted"
      - key: DB_CONNECT_TIMEOUT_SEC
        value: "8"
      - key: DB_BREAKER_OPEN_SEC
        value: "30"
      # Header HSTS cho web/admin (0 khi dùng tên miền riêng chưa có HTTPS).
      - key: SECURITY_HSTS
        value: "1"
      - key: ROUTER9_CALL_TIMEOUT_SEC
        value: "120"
      - key: ROUTER9_STEP_DELAY_SEC
        value: "3"
      - key: ROUTER9_MAX_CONCURRENCY
        value: "2"
      - key: GROQ_MAX_CONCURRENCY
        value: "2"
      - key: OPENROUTER_MAX_CONCURRENCY
        value: "2"
      - key: VNSTOCK_MAX_CONCURRENCY
        value: "1"
      - key: ZALO_NODE_HEAP_MB
        value: "96"
      # --optimize-for-size cho node gateway (scripts/run-zalo-gateway.sh); 0 = tắt.
      - key: ZALO_NODE_OPTIMIZE_SIZE
        value: "1"
      # Trả heap rảnh của Python về hệ điều hành mỗi 10 phút + sau việc nặng
      # (core/memtrim.py: gc.collect + malloc_trim); 0 = tắt phần định kỳ.
      - key: MEMORY_TRIM_INTERVAL_SEC
        value: "600"
      - key: VNSTOCK_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: AGNES_API_KEY
        sync: false
      - key: AGNES_BASE_URL
        value: https://apihub.agnes-ai.com/v1
      - key: AGNES_IMAGE_MODEL
        value: agnes-image-2.1-flash
      - key: AGNES_CALL_TIMEOUT_SEC
        value: "90"
      - key: ZOOM_ENABLED
        value: "true"
      - key: ZOOM_CLIENT_ID
        sync: false
      - key: ZOOM_CLIENT_SECRET
        sync: false
      - key: ZOOM_BOT_JID
        sync: false
      - key: ZOOM_SECRET_TOKEN
        sync: false
      - key: ZOOM_VERIFICATION_TOKEN
        sync: false
      - key: ZOOM_ACCOUNT_ID
        sync: false
      # Facebook Page publishing (Zalo -> duyệt -> đăng Facebook Page).
      # Page mặc định ("default" khi dùng /fb_pages):
      - key: FACEBOOK_PAGE_ID
        sync: false
      - key: FACEBOOK_PAGE_ACCESS_TOKEN
        sync: false
      - key: FACEBOOK_GRAPH_VERSION
        value: v26.0
      # Page thứ 2 trở đi (tuỳ chọn): thêm hậu tố _<page_key>, vd _2. /fb_ok sẽ
      # tự đăng lên MỌI page có đủ cả 2 biến FACEBOOK_PAGE_ID_*/FACEBOOK_PAGE_ACCESS_TOKEN_*.
      - key: FACEBOOK_PAGE_ID_2
        sync: false
      - key: FACEBOOK_PAGE_ACCESS_TOKEN_2
        sync: false
      # Page RIÊNG cho báo cáo chứng khoán + tin CafeF tự động (services/market_page.py).
      # Không nằm trong /fb_pages và /fb_ok không đăng lên đây; bỏ trống = tắt luồng.
      # Lọc bài từ nhóm Zalo trước khi vào hàng chờ Facebook (1 = bật, 0 = tắt):
      # chỉ nhận bài có ĐỦ cả ảnh lẫn caption.
      - key: FACEBOOK_REQUIRE_PHOTO_AND_CAPTION
        value: "1"
      # Bỏ bài chỉ báo mã giảm giá/săn deal (không có giá sản phẩm, ngắn).
      - key: FACEBOOK_SKIP_VOUCHER_POSTS
        value: "1"
      # Hàng chờ tối đa (vượt thì tự xoá bài chờ cũ nhất), số ngày chống trùng,
      # số ngày giữ bài đã đăng/bỏ qua (ảnh của chúng bị xoá ngay).
      - key: FACEBOOK_MAX_PENDING
        value: "150"
      - key: FACEBOOK_DEDUP_DAYS
        value: "7"
      - key: FACEBOOK_HISTORY_DAYS
        value: "30"
      # Thời gian chờ gộp ảnh + caption cùng người gửi trong nhóm nguồn (ms).
      - key: ZALO_FB_MERGE_WINDOW_MS
        value: "30000"
      # Tự VACUUM FULL bảng ảnh 1 lần/tuần (3h sáng Chủ nhật giờ VN) khi an toàn.
      - key: DB_AUTO_VACUUM_FULL
        value: "1"
      - key: DB_SIZE_LIMIT_MB
        value: "500"
      - key: FACEBOOK_PAGE_ID_MARKET
        sync: false
      - key: FACEBOOK_PAGE_ACCESS_TOKEN_MARKET
        sync: false
      # Giờ đăng của Page trên (giờ VN, HH:MM, nhiều mốc cách nhau bằng dấu phẩy).
      # Báo cáo chứng khoán chỉ chạy thứ 2-6; tin CafeF chạy hằng ngày.
      - key: MARKET_STOCK_TIMES_VN
        value: "15:20"
      - key: MARKET_NEWS_TIMES_VN
        value: "08:30"
      # Ảnh bản tin: branded (ảnh bài CafeF + khung/logo) hoặc none (không ảnh).
      - key: MARKET_NEWS_IMAGE
        value: "branded"
      # Chạy bù/thử lại khi lỡ giờ hoặc lỗi: khung (phút), khoảng cách (phút), số lần.
      - key: MARKET_CATCHUP_MIN
        value: "120"
      - key: MARKET_RETRY_MIN
        value: "10"
      - key: MARKET_MAX_ATTEMPTS
        value: "4"
      # Zoom làm kênh phụ cho cảnh báo chủ bot (critical|fallback|all|off).
      - key: ALERT_ZOOM_MIRROR
        value: critical
      # Watchdog luật cố định: RAM working set, dung lượng DB, inbox ứ đọng, job quá hạn,
      # nhịp tim/khởi động lại (services/watchdog.py). 0 = tắt.
      - key: WATCHDOG_ENABLED
        value: "1"
      - key: WATCHDOG_MEMORY_PCT
        value: "85"
      - key: WATCHDOG_INBOX_STALE_MIN
        value: "10"
      - key: WATCHDOG_RESTART_GAP_MIN
        value: "20"
      - key: WATCHDOG_RESTART_BURST
        value: "3"
      # Gom lỗi theo loại + vị trí code, báo lỗi mới (tối đa N/giờ), tổng hợp hôm qua
      # lúc ERROR_DIGEST_HOUR_VN giờ VN (-1 = tắt); lệnh /loi.
      - key: ERROR_DIGEST_ENABLED
        value: "1"
      - key: ERROR_ALERT_IMMEDIATE
        value: "1"
      - key: ERROR_ALERT_MAX_PER_HOUR
        value: "4"
      - key: ERROR_DIGEST_HOUR_VN
        value: "7"
      # Báo khi bản sao lưu DB (GitHub Actions backup.yml) mới nhất quá N ngày; 0 = tắt.
      - key: BACKUP_STALE_DAYS
        value: "3"
      # Có SETTINGS_ENC_KEY_OLD: tự mã hoá lại giá trị settings còn ở khoá cũ lúc khởi
      # động rồi báo số còn lại (0 = chỉ báo, bấm nút trên /admin).
      - key: SETTINGS_AUTO_ROTATE
        value: "1"
      # Quota miễn phí từng provider (services/quota_burn.py): cảnh báo khi dùng >= N%
      # hạn mức trong cửa sổ quota (0 = tắt). Hạn mức 0 = chưa đặt (chỉ hiển thị trên
