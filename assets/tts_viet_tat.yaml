# Từ điển đọc giọng cho tin thoại /noi (services/tts_normalize.py).
#
# Bộ đọc Gemini TTS/Live đọc NGUYÊN VĂN chữ được gửi: "LNST", "ko", "P/E" mà để
# nguyên thì bị đọc lướt, đọc kiểu tiếng Anh hoặc bỏ qua. Bảng này đổi chữ viết tắt
# thành chữ đọc được TRƯỚC khi gửi đi; bản tin chữ không đổi.
#
# - chinh_xac: khớp NGUYÊN TỪ, phân biệt hoa/thường đúng như khoá ("CK" = chứng
#   khoán, "ck" = chuyển khoản).
# - khong_phan_biet: khớp nguyên từ, không phân biệt hoa/thường.
# - chu_cai: cách đọc từng chữ cái cho mã cổ phiếu/chữ viết tắt in hoa 2-3 ký tự
#   không có trong bảng (FPT -> "ép pê tê").
# - doc_nguyen: từ in hoa KHÔNG đánh vần (tiếng Việt không dấu hay gặp: "ANH ơi").
#
# Khoá dài được ưu tiên trước khoá ngắn ("TP.HCM" trước "TP"). Sửa thoải mái,
# không cần đổi code (đọc lại khi khởi động).

