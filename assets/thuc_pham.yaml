# Bảng món Việt phổ biến cho lệnh /an (services/nutrition_service.py).
#
# kcal là ƯỚC LƯỢNG cho 1 khẩu phần thường gặp ngoài hàng/ở nhà (cột phan), tổng
# hợp từ các bảng thành phần dinh dưỡng phổ thông - cùng một món có thể chênh
# 20-40% tuỳ công thức, lượng dầu mỡ, đường, nước dùng. Chỉ để tham khảo, không
# phải tư vấn dinh dưỡng. Sửa thoải mái, không cần đổi code.
#
# ten: tên hiển thị; goi: các cách gọi khác (viết có dấu - người dùng gõ không dấu
# vẫn khớp); món khớp tên dài nhất thắng ("bún bò huế" thắng "bún").

