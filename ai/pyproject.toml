[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["zalo-gateway/dist"]
# CI (job python-format) truyền danh sách file đã thay đổi dưới dạng đường dẫn
# TƯỜNG MINH. Ruff mặc định bỏ qua exclude với đường dẫn tường minh, nên phải
# bật force-exclude thì [tool.ruff.format].exclude bên dưới mới có hiệu lực.
force-exclude = true

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
# Hai file dưới đây là code lõi phân tích chứng khoán, viết trước khi repo áp
# chuẩn ruff format. Reformat cả file chỉ để sửa vài dòng sẽ tạo diff khổng lồ
# lên đúng phần code quyết định stop/target/tỷ trọng - rủi ro sai sót cao hơn
# lợi ích thẩm mỹ. Chúng VẪN bị `ruff check .` soi lint như mọi file khác, chỉ
# được miễn format check. Code mới KHÔNG được thêm vào danh sách này.
exclude = [
    "stock/analysis.py",
    "stock/sector.py",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
