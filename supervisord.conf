; Chạy root (không đổi user cho từng program): trên Render, supervisord đổi user
; nhưng KHÔNG đổi HOME (vẫn /root) -> asyncpg tìm ~/.postgresql/root.crt trong
; /root và chết vì PermissionError; đồng thời runtime Render không cho root kill
; tiến trình khác uid (os.kill -> EPERM) nên graceful shutdown cũng hỏng.
; Deploy a0c1aa2 (10/2026) thất bại đúng vì điều này.
[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
user=root

[program:web]
; --limit-concurrency đếm cả kết nối keep-alive đang rảnh, dùng chung cho webhook
; Telegram/Zoom, cầu nối Zalo (giữ kết nối suốt 1 lượt AI) và web công khai.
; 8 từng bị vượt khi vài người mở web cùng lúc (503 cả cho webhook). Kết nối rảnh
; chỉ tốn vài chục KB; RAM nặng đã bị chặn riêng (RequestLimitsMiddleware, số
; lượt AI song song, hàng đợi Zalo) nên 32 vẫn an toàn với 512 MB.
command=/usr/local/bin/uvicorn web:api --host 0.0.0.0 --port %(ENV_PORT)s --workers 1 --limit-concurrency 32 --timeout-keep-alive 5 --no-access-log
directory=/app
autostart=true
autorestart=true
startsecs=5
; Supabase chập chờn đúng lúc deploy (uvicorn thoát trước startsecs) không được
; làm tiến trình web rơi FATAL sau 3 lần mặc định - cùng mức với gateway.
startretries=20
; web.py drain webhook inbox tới 30s khi tắt; mặc định 10s sẽ SIGKILL giữa chừng.
stopwaitsecs=40
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:zalo-gateway]
command=/app/scripts/run-zalo-gateway.sh
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=20
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
