[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
user=root

[program:web]
command=/usr/local/bin/uvicorn web:api --host 0.0.0.0 --port %(ENV_PORT)s --workers 1 --limit-concurrency 8 --timeout-keep-alive 5 --no-access-log
directory=/app
autostart=true
autorestart=true
startsecs=5
; web.py drain webhook inbox tới 30s khi tắt; mặc định 10s sẽ SIGKILL giữa chừng.
stopwaitsecs=40
stopasgroup=true
killasgroup=true
user=app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:zalo-gateway]
command=/app/scripts/run-zalo-gateway.sh
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=20
stopwaitsecs=15
stopasgroup=true
killasgroup=true
user=app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
